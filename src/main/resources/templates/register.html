<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Créer un compte</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-dark text-light d-flex justify-content-center align-items-center vh-100">

<div class="card p-4 shadow-lg" style="width: 350px; background-color: #2a2a3a;">
    <h2 class="text-center mb-3" style="color: white;">Créer un compte</h2>

    <form th:action="@{/register}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

        <div class="mb-3">
            <input type="text" name="username" class="form-control" placeholder="Username" required>
        </div>

        <div class="mb-3">
            <input type="password" name="password" class="form-control" placeholder="Password" required>
        </div>

        <button type="submit" class="btn btn-primary w-100">Créer un compte</button>
    </form>

    <!-- error -->
    <div class="text-danger mt-2 text-center" th:if="${error}" th:text="${error}"></div>

    <hr class="text-light">

    <div class="text-center">
        <a th:href="@{/login}" class="text-info">Vous avez deja un compte? Se Connecter</a>
    </div>

    <div class="text-center mt-2">
        <a th:href="@{/index}" class="btn btn-outline-light btn-sm">← Retour au accueil</a>
    </div>
</div>

</body>
</html>
